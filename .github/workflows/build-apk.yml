name: Build Amazonia APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest   # GitHub's free Ubuntu runner has Android SDK pre-installed

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Set up Java 17 (required for Android builds)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install Expo CLI and dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 5. Install Expo CLI globally
      - name: Install Expo CLI
        run: npm install -g @expo/cli

      # 6. Generate native Android project from Expo config
      - name: Expo Prebuild (generate Android project)
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 7. Make Gradle wrapper executable
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # 8. Build the APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 9. Upload APK as downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazonia-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. Print download info
      - name: Build Complete
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "========================================"
          echo "  APK BUILD COMPLETE!"
          echo "  Size: $SIZE"
          echo "  Download from GitHub Actions artifacts"
          echo "========================================"
