name: Build Amazonia APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Fix memory + bundle JS into APK (critical for standalone install) ──
      - name: Configure Gradle and bundle JS
        run: |
          # Remove conflicting jvmargs first
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties

          # Add memory + disable Jetifier (fixes heap crash) + bundle debug
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          android.enableJetifier=false
          BUNDLE_IN_DEBUG=true
          EOF

          # Create assets folder
          mkdir -p android/app/src/main/assets

          # Bundle JavaScript into the APK (required for standalone install)
          echo "Bundling JavaScript..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --reset-cache || \
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

          echo "Bundle size: $(du -sh android/app/src/main/assets/index.android.bundle)"

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers 1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
          _JAVA_OPTIONS: "-Xmx6g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazonia-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Done
        run: |
          echo "========================================"
          echo "  APK BUILD COMPLETE!"
          ls -lh android/app/build/outputs/apk/debug/
          echo "========================================"
