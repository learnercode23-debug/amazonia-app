name: Build Amazonia APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Fix Java heap space: disable Jetifier + max memory ──────────────────
      - name: Fix Gradle memory and disable Jetifier
        run: |
          # Remove existing jvmargs to avoid conflict
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties

          cat >> android/gradle.properties << 'EOF'

          # Memory fix
          org.gradle.jvmargs=-Xmx7168m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          org.gradle.workers.max=1

          # Disable Jetifier — fixes JetifyTransform Java heap space crash
          android.enableJetifier=false
          EOF

          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers 1 --info 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx7168m -XX:MaxMetaspaceSize=1024m"
          _JAVA_OPTIONS: "-Xmx7168m"

      - name: Locate APK
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazonia-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Done
        run: |
          echo "========================================"
          echo "  APK BUILD COMPLETE!"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null
          echo "========================================"
