name: Build Amazonia APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Fix Gradle memory + disable Jetifier
        run: |
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          android.enableJetifier=false
          EOF

      # Generate a self-signed keystore for release signing
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/amazonia-release.keystore \
            -alias amazonia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass amazonia123 \
            -keypass amazonia123 \
            -dname "CN=Amazonia, OU=App, O=Amazonia, L=Kathmandu, ST=Bagmati, C=NP"
          echo "Keystore created!"

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Build RELEASE APK — bundles JS automatically, works without Metro server
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers 1 \
            -Pandroid.injected.signing.store.file=amazonia-release.keystore \
            -Pandroid.injected.signing.store.password=amazonia123 \
            -Pandroid.injected.signing.key.alias=amazonia \
            -Pandroid.injected.signing.key.password=amazonia123
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
          _JAVA_OPTIONS: "-Xmx6g"

      - name: Locate APK
        run: |
          find android/app/build/outputs -name "*.apk" -type f
          ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazonia-App
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "========================================"
          echo "  RELEASE APK BUILD COMPLETE!"
          ls -lh android/app/build/outputs/apk/release/
          echo "========================================"
